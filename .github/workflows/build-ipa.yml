name: Build Bloxify Updates IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project BloxifyUpdates.xcodeproj -scheme BloxifyUpdates \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' build
      - name: Package unsigned IPA for Sideloadly
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BloxifyUpdates.app Payload/
          zip -qry BloxifyUpdates-unsigned.ipa Payload
          unzip -t BloxifyUpdates-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: BloxifyUpdates-IPA
          path: BloxifyUpdates-unsigned.ipa
