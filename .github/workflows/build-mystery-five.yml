name: Build Mystery Five IPA
on:
  push:
    branches: [main]
    paths:
      - 'MysteryFive/**'
      - '.github/workflows/build-mystery-five.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: MysteryFive
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build offline iPhone app
        run: |
          xcodebuild -project MysteryFive.xcodeproj -scheme MysteryFive \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MysteryFive.app Payload/
          zip -qry MysteryFive-unsigned.ipa Payload
          unzip -t MysteryFive-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: MysteryFive-IPA
          path: MysteryFive/MysteryFive-unsigned.ipa
